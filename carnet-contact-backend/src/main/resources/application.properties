spring.application.name=carnet-contact-backend

# --- Base de donnees H2 en memoire ---
# DB_CLOSE_DELAY=-1 : la base survit tant que l'application tourne (sinon H2
# la ferme des qu'aucune connexion n'est ouverte, et tout est perdu).
spring.datasource.url=jdbc:h2:mem:carnet;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# update : Hibernate cree et fait evoluer les tables d'apres les entites.
spring.jpa.hibernate.ddl-auto=update

# Console H2 : http://localhost:8080/h2-console
# (JDBC URL a saisir dans le formulaire : jdbc:h2:mem:carnet)
spring.h2.console.enabled=true

# --- JWT ---
# La cle de signature. En vrai projet elle ne doit JAMAIS etre versionnee :
# la syntaxe ${VARIABLE:defaut} permet de la surcharger par une variable
# d'environnement, la valeur ci-dessous ne servant qu'au developpement.
# HS256 exige au moins 32 caracteres.
carnet.jwt.secret=${CARNET_JWT_SECRET:cle-de-developpement-a-remplacer-en-production-32c}
# 24 heures
carnet.jwt.duree-ms=86400000

# Sans cet exclude, Spring Boot cree un utilisateur "user" en memoire avec un
# mot de passe aleatoire affiche a chaque demarrage. Inutile ici : notre
# authentification passe entierement par le filtre JWT, jamais par un
# UserDetailsService. On evite ainsi un message trompeur au demarrage.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
