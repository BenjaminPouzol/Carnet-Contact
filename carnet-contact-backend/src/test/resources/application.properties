# Configuration utilisee UNIQUEMENT pendant les tests.
#
# Un fichier de meme nom dans src/test/resources prend le pas sur celui de
# src/main/resources : les tests tournent donc dans leur propre monde, sans
# qu'on ait a modifier la configuration de developpement pour les faire passer.
# Il doit en revanche etre COMPLET — il remplace l'autre, il ne s'y ajoute pas.

spring.application.name=carnet-contact-backend-test

# Une base distincte de celle du developpement, et create-drop plutot que
# update : le schema est recree a chaque demarrage du contexte de test, donc
# aucune trace d'une execution precedente ne peut fausser un resultat.
spring.datasource.url=jdbc:h2:mem:carnet-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Cle fixe : les tests doivent etre reproductibles, pas secrets.
carnet.jwt.secret=cle-de-test-suffisamment-longue-pour-hs256-32c
carnet.jwt.duree-ms=900000
carnet.jwt.rafraichissement-duree-ms=604800000

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
