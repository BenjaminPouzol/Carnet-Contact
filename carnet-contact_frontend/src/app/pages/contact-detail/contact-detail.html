@if (contact(); as c) {
  <h2>{{ c.prenom }} {{ c.nom }}</h2>
  <p>Email : {{ c.email }}</p>
  <p>Téléphone : {{ c.telephone }}</p>

  <a [routerLink]="['/contact', c.id, 'modifier']">Modifier</a>
} @else {
  <p>Contact introuvable (ou en cours de chargement).</p>
}

<p><a routerLink="/">Retour à la liste</a></p>
