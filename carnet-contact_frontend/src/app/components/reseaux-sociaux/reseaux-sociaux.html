<!-- Les logos sont des SVG écrits directement dans le gabarit (« inline »),
     pas des images téléchargées. Trois raisons : aucune requête réseau
     supplémentaire, aucune dépendance à un site tiers qui pourrait tomber,
     et un SVG se colore en CSS — impossible avec un PNG. -->

@if (liens().length > 0) {
  <ul class="reseaux">
    @for (lien of liens(); track lien.cle) {
      <li>
        <a
          [href]="lien.url"
          target="_blank"
          rel="noopener noreferrer"
          [style.--couleur-reseau]="lien.couleur"
          [attr.aria-label]="lien.nom"
          [title]="lien.nom">

          <!-- @switch : l'équivalent du switch/case de TypeScript, côté
               gabarit. Ici il choisit le bon tracé SVG selon le réseau. -->

              </svg>
            }
            @case ('twitter') {
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18.9 2.5h3.37l-7.36 8.41L23.5 21.5h-6.9l-5.4-7.07-6.19 7.07H1.63l7.68-8.78L1 2.5h7.08l5.08 6.71L18.9 2.5zm-1.2 17h1.87L6.4 4.4H4.4l13.3 15.1z"/>
              </svg>
            }
            @case ('facebook') {
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.78-1.63 1.57v1.88h2.78l-.45 2.91h-2.33V22c4.78-.76 8.44-4.92 8.44-9.94z"/>

            }
            @case ('twitch') {
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4.27 1.5L2 5.77v13.46h4.55V22h2.27l2.27-2.77h3.41L21 14.68V1.5H4.27zm14.46 12.27l-2.84 2.84h-4.55l-2.27 2.27v-2.27H5.68V3.2h13.05v10.57zM15.5 6.6h1.7v5.1h-1.7V6.6zm-4.55 0h1.7v5.1h-1.7V6.6z"/>

              </svg>
            }
            @case ('linkedin') {
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 110-4.12 2.06 2.06 0 010 4.12zm1.78 13.02H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.22.79 24 1.77 24h20.45c.98 0 1.78-.78 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/>
              </svg>
            }
          }
        </a>
      </li>
    }
  </ul>
}
