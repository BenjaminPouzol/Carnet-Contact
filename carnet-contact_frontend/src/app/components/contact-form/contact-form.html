<div class="carte bloc-ajout">
  <h2>Ajouter un contact</h2>

  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
    <!-- Les champs essentiels, toujours visibles -->
    <div class="grille">
      <div>
        <label for="nom">Nom</label>
        <input pInputText id="nom" formControlName="nom" placeholder="Dupont" />
      </div>
      <div>
        <label for="prenom">Prénom</label>
        <input pInputText id="prenom" formControlName="prenom" placeholder="Jean" />
      </div>
      <div>
        <label for="email">Email</label>
        <input pInputText id="email" type="email" formControlName="email" placeholder="jean@exemple.fr" />
      </div>
      <div>
        <label for="telephone">Téléphone</label>
        <input pInputText id="telephone" formControlName="telephone" placeholder="06 01 02 03 04" />
      </div>
    </div>

    <!-- Le reste est optionnel : replié par défaut pour ne pas noyer
         l'essentiel sous treize champs. -->
    <p-button
      class="bascule-details"
      severity="secondary"
      [text]="true"
      [icon]="detailsOuverts() ? 'pi pi-chevron-up' : 'pi pi-chevron-down'"
      [label]="detailsOuverts() ? 'Masquer les détails' : 'Plus de détails (email pro, photo, réseaux sociaux)'"
      (onClick)="basculerDetails()" />

    @if (detailsOuverts()) {
      <div class="details">
        <div class="grille">
          <div>
            <label for="emailPro">Email professionnel</label>
            <input pInputText id="emailPro" type="email" formControlName="emailPro"
                   placeholder="j.dupont@entreprise.fr" />
            <!-- L'erreur ne s'affiche qu'une fois le champ QUITTÉ (touched) :
                 signaler « email invalide » dès la première lettre tapée est
                 inutilement agressif. -->
            @if (contactForm.get('emailPro')?.invalid && contactForm.get('emailPro')?.touched) {
              <p class="erreur-champ">Format d'adresse invalide.</p>
            }
          </div>
          <div>
            <label for="photoUrl">Photo (URL)</label>
            <input pInputText id="photoUrl" formControlName="photoUrl"
                   placeholder="https://exemple.fr/jean.jpg" />
          </div>
        </div>

        <h3 class="titre-reseaux">Réseaux sociaux</h3>
        <p class="muet aide-reseaux">
          URL complète ou simple pseudo — les deux fonctionnent.
        </p>

        <div class="grille">
          <!-- Un seul bloc de champ, répété par la boucle. Ajouter un
               septième réseau ne demanderait qu'une ligne dans RESEAUX. -->
          @for (reseau of reseaux; track reseau.cle) {
            <div>
              <label [for]="reseau.cle">{{ reseau.nom }}</label>
              <input pInputText [id]="reseau.cle" [formControlName]="reseau.cle"
                     [placeholder]="'@pseudo'" />
            </div>
          }
        </div>
      </div>
    }

    <!-- type="submit" est passé en attribut ordinaire : p-button le recopie sur
         le <button> qu'il génère, donc le formulaire part toujours sur
         (ngSubmit). -->
    <p-button
      type="submit"
      styleClass="valider"
      icon="pi pi-user-plus"
      label="Ajouter"
      [disabled]="contactForm.invalid || chargement()" />
  </form>
</div>
