<h1>{{ title() }}</h1>

<!-- Indicateur de chargement : visible tant qu'au moins une requête HTTP est
     en cours. Alimenté par chargementInterceptor. -->
@if (etatHttp.chargement()) {
  <p class="chargement">Chargement…</p>
}

<!-- Bannière d'erreur : affichée seulement si le signal erreur() n'est pas
     null. Alimentée par erreurInterceptor. -->
@if (etatHttp.erreur(); as message) {
  <p class="erreur">{{ message }}</p>
}

<router-outlet />
